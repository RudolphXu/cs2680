<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Web</title>
<!-- Markdown renderer + HTML sanitizer (small libraries from a CDN, allowed by SPEC §2) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --border: #e2e2de;
    --code-bg: #f1f1ee;
    --accent: #c15f3c;
    --pending: #b7791f;
    --pending-bg: #fdf6e7;
    --ok: #2f855a;
    --ok-bg: #edf7f1;
    --err: #c53030;
    --err-bg: #fdeeee;
    --sub: #6b5bd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1a;
      --panel: #252524;
      --text: #ececea;
      --muted: #9a9a96;
      --border: #3a3a38;
      --code-bg: #2f2f2d;
      --accent: #e08a65;
      --pending: #e3b25a;
      --pending-bg: #3a3122;
      --ok: #6cc596;
      --ok-bg: #1f3329;
      --err: #f08080;
      --err-bg: #3d2323;
      --sub: #a79cf0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

  /* ---------- top bar ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  }
  header h1 { font-size: 16px; margin: 0; margin-right: 8px; }
  .control { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  select, button { font: inherit; font-size: 14px; }
  select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  button.primary {
    padding: 5px 16px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; }

  /* run status badge */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.running  { color: var(--pending); background: var(--pending-bg); border-color: transparent; }
  .badge.running::before { animation: pulse 1s infinite; }
  .badge.finished { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .badge.failed   { color: var(--err); background: var(--err-bg); border-color: transparent; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- main column ---------- */
  /* ---------- page layout: outline (left) + dialogue (right) ---------- */
  .layout {
    display: grid; grid-template-columns: 260px minmax(0, 1fr);
    gap: 20px; max-width: 1240px; margin: 0 auto; padding: 16px;
  }
  main { min-width: 0; max-width: 920px; }

  /* ---------- outline = flowchart of tool calls ---------- */
  #outline {
    position: sticky; top: calc(var(--header-h, 56px) + 16px);
    align-self: start;
    max-height: calc(100vh - var(--header-h, 56px) - 32px); overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 8px 14px; font-size: 13px;
  }
  #outline h2 { font-size: 12px; color: var(--muted); font-weight: 500; font-style: italic; margin: 0 6px 10px; }
  #outline .empty-outline { color: var(--muted); padding: 4px 6px; }

  /* tool colours: each family gets a fill (--nbg) and a text colour (--nfg) */
  :root {
    --line: #bcbcb6; --line-sub: #8fa6e0; --col-bg: rgba(36, 87, 214, .05);
    --you-bg: #ececea;    --you-fg: #333331;
    --read-bg: #e3f1e8;   --read-fg: #2c6e49;
    --edit-bg: #fbeedd;   --edit-fg: #9a4f12;
    --bash-bg: #f5e4e4;   --bash-fg: #7a2a2a;
    --agent-bg: #e6eefd;  --agent-fg: #2457d6;
    --web-bg: #dff2f3;    --web-fg: #1b6a73;
    --todo-bg: #eee8fb;   --todo-fg: #5a43b8;
    --other-bg: #efeee8;  --other-fg: #5d5a50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --line: #55554f; --line-sub: #4f639a; --col-bg: rgba(148, 179, 255, .06);
      --you-bg: #353533;    --you-fg: #e2e2df;
      --read-bg: #1d3226;   --read-fg: #85d3a6;
      --edit-bg: #3a2b1b;   --edit-fg: #f0b27a;
      --bash-bg: #3a2323;   --bash-fg: #f0a5a5;
      --agent-bg: #1d2944;  --agent-fg: #94b3ff;
      --web-bg: #183335;    --web-fg: #7fd4db;
      --todo-bg: #2a2440;   --todo-fg: #baa9f6;
      --other-bg: #2f2f2c;  --other-fg: #c9c6ba;
    }
  }
  .f-you   { --nbg: var(--you-bg);   --nfg: var(--you-fg); }
  .f-read  { --nbg: var(--read-bg);  --nfg: var(--read-fg); }
  .f-edit  { --nbg: var(--edit-bg);  --nfg: var(--edit-fg); }
  .f-bash  { --nbg: var(--bash-bg);  --nfg: var(--bash-fg); }
  .f-agent { --nbg: var(--agent-bg); --nfg: var(--agent-fg); }
  .f-web   { --nbg: var(--web-bg);   --nfg: var(--web-fg); }
  .f-todo  { --nbg: var(--todo-bg);  --nfg: var(--todo-fg); }
  .f-other { --nbg: var(--other-bg); --nfg: var(--other-fg); }

  /* a node = one tool call (or a "You" node where a run starts) */
  .fnode {
    max-width: 100%; min-width: min(92px, 100%);
    padding: 2px 12px; border: 1.5px solid transparent; border-radius: 9px;
    background: var(--nbg); color: var(--nfg); cursor: pointer;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fnode:hover { filter: brightness(.96); }
  .fnode.pending { border-color: var(--nfg); animation: node-pulse 1.2s infinite; }
  .fnode.error { border-color: var(--err); }
  .fnode.error::after { content: " ✕"; color: var(--err); }
  .fnode.current { box-shadow: 0 0 0 2.5px var(--accent); }
  @keyframes node-pulse { 50% { border-color: transparent; } }

  /* a lane = nodes stacked top to bottom, joined by a vertical line */
  .lane { display: flex; flex-direction: column; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; max-width: 100%; }
  .item::before { content: ""; height: 10px; border-left: 1.5px solid var(--line); }
  #flow > .item:first-child::before { display: none; }

  /* a fork = parallel subagents: one column each, side by side */
  .item.fork { align-self: stretch; }
  .cols { display: flex; width: 100%; }
  .col { position: relative; flex: 1 1 0; min-width: 0; padding: 0 3px; display: flex; flex-direction: column; }
  /* horizontal bars at the top (split) and bottom (join), from first to last column centre */
  .col::before, .col::after { content: ""; position: absolute; left: 0; right: 0; }
  .col::before { top: 0; border-top: 1.5px solid var(--line); }
  .col::after { bottom: 0; border-bottom: 1.5px solid var(--line); }
  .col:first-child::before, .col:first-child::after { left: 50%; }
  .col:last-child::before, .col:last-child::after { right: 50%; }
  .col .lane .item::before { border-color: var(--line-sub); }
  /* a light panel behind each subagent's column, so it's clear where the subagent ends */
  .col > .lane { background: var(--col-bg); border-radius: 10px; padding: 0 4px 6px; }
  .col .fnode { padding: 2px 6px; min-width: min(72px, 100%); }
  .col .col > .lane { padding: 0 2px 4px; }
  /* each column's line runs down to the join bar, so short columns still meet it */
  .tail { flex: 1; min-height: 10px; align-self: center; border-left: 1.5px solid var(--line-sub); }
  /* still running: dashed until that subagent / all subagents are done */
  .col:not(.ended) > .tail { border-left-style: dashed; }
  .fork:not(.joined) > .cols > .col::after { border-bottom-style: dashed; }

  /* subagent folded in the dialogue: only a line and "N 个事件已折叠" */
  .folded {
    display: none; align-self: center; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--muted); padding: 0; text-align: center;
  }
  .folded::before { content: ""; display: block; width: 0; height: 10px; margin: 0 auto 2px; border-left: 1.5px solid var(--line-sub); }
  .folded:hover { color: var(--text); }
  .col.collapsed > .folded { display: block; }
  .col.collapsed > .lane > .item:not(:first-child) { display: none; }

  #outline-btn { display: none; }

  /* narrow window: the outline folds into a drawer opened by the "目录" button */
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    #outline-btn { display: inline-block; }
    #outline {
      position: fixed; z-index: 20; top: var(--header-h, 56px); left: 0; bottom: 0;
      width: min(300px, 85vw); max-height: none; border-radius: 0;
      align-self: stretch; /* fill top-to-bottom; "start" would shrink it to its content */
      box-shadow: 4px 0 16px rgba(0,0,0,.15);
      transform: translateX(-105%); transition: transform .2s;
    }
    body.outline-open #outline { transform: none; }
  }
  button.ghost {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); cursor: pointer;
  }

  /* briefly highlight the card the outline jumped to */
  .tool { scroll-margin-top: calc(var(--header-h, 56px) + 16px); }
  .tool.flash, .user-prompt.flash { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .3s; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .session-box { display: none; font-size: 13px; color: var(--muted); }
  .session-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .session-box b { color: var(--text); font-weight: 500; }
  .session-box .resumed { color: var(--sub); margin-top: 4px; }

  /* one section per run; follow-ups are added below */
  .run { scroll-margin-top: calc(var(--header-h, 56px) + 16px); }
  .run + .run { border-top: 1px dashed var(--border); margin-top: 20px; padding-top: 8px; }
  .run-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin: 4px 0; }
  .resume-chip {
    color: var(--sub); border: 1px solid var(--sub); border-radius: 999px; padding: 0 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere;
  }
  #runs:empty + #composer { margin-top: 0; }

  /* composer in follow-up mode */
  .follow-banner { display: none; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
                   font-size: 13px; color: var(--sub); }
  .follow-banner b { font-weight: 500; overflow-wrap: anywhere; }
  #composer.follow-up .follow-banner { display: flex; }
  #composer.follow-up { border-color: var(--sub); }
  #composer input[readonly] { opacity: .6; cursor: not-allowed; }
  .error-box { color: var(--err); background: var(--err-bg); border-color: transparent; }
  .error-box h3 { margin: 0 0 6px; font-size: 15px; }
  .error-box p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .error-box pre {
    margin: 6px 0 0; padding: 8px; border-radius: 6px; background: var(--panel); color: var(--text);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto;
  }

  /* composer: mode, prompt, working directory, Run */
  #composer { display: flex; flex-direction: column; gap: 10px; }
  .mode-switch { display: flex; gap: 16px; font-size: 14px; }
  .mode-switch label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #composer textarea, #composer input[type=text] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  #composer textarea { resize: vertical; min-height: 64px; }
  #composer input[type=text] { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  #composer textarea:disabled, #composer input:disabled { opacity: .6; }
  .live-only { display: flex; flex-direction: column; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .replay-only .field { flex-direction: row; align-items: center; gap: 8px; }
  #composer.mode-replay .live-only, #composer.mode-live .replay-only { display: none; }
  .composer-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .form-error { color: var(--err); font-size: 13px; }

  /* the prompt of the current run, echoed into the dialogue */
  .user-prompt {
    background: var(--code-bg); border-radius: 10px; padding: 10px 14px; margin: 12px 0;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user-prompt .who { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }

  /* assistant text (markdown) */
  .msg { padding: 2px 4px; margin: 10px 0; overflow-wrap: anywhere; }
  .msg > :first-child { margin-top: 0; }
  .msg > :last-child { margin-bottom: 0; }
  .msg pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .msg :not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  .msg table { border-collapse: collapse; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; }

  /* subagent section, nested inside the Agent/Task tool card that spawned it */
  .tool details.subagent { border-top: 1px solid var(--border); }
  .tool details.subagent > summary { color: var(--sub); font-weight: 500; font-size: 13px; padding: 6px 12px; }
  .subagent-body {
    margin: 0 12px 10px 14px; padding-left: 12px;
    border-left: 3px solid var(--sub);
  }

  /* tool call card */
  .tool { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden; }
  .tool-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  .tool-name { font-weight: 600; }
  .tool-key {
    flex: 1 1 200px; min-width: 0; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-status { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .tool.pending { border-left: 4px solid var(--pending); }
  .tool.pending .tool-status { color: var(--pending); background: var(--pending-bg); }
  .tool.ok { border-left: 4px solid var(--ok); }
  .tool.ok .tool-status { color: var(--ok); background: var(--ok-bg); }
  .tool.error { border-left: 4px solid var(--err); }
  .tool.error .tool-status { color: var(--err); background: var(--err-bg); }
  .tool.error .tool-result pre { color: var(--err); }
  .tool details { border-top: 1px solid var(--border); }
  .tool summary { cursor: pointer; padding: 4px 12px; font-size: 12px; color: var(--muted); }
  .tool details pre, .tool-result pre {
    margin: 0; padding: 8px 12px; background: var(--code-bg);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 480px; overflow-y: auto;
  }
  .tool-result { border-top: 1px solid var(--border); }
  .tool-result:empty { display: none; }
  .fold-btn {
    display: block; width: 100%; text-align: left; border: 0; border-top: 1px dashed var(--border);
    background: var(--code-bg); color: var(--accent); padding: 4px 12px; cursor: pointer; font-size: 12px;
  }

  /* quiet events: system notices, unknown types */
  .quiet { color: var(--muted); font-size: 12px; margin: 4px 0; padding-left: 4px; }
  body:not(.show-quiet) .quiet { display: none; }
  details.quiet-block { font-size: 13px; color: var(--muted); margin: 8px 0; }
  details.quiet-block pre { white-space: pre-wrap; background: var(--code-bg); padding: 8px; border-radius: 6px; max-height: 300px; overflow: auto; }

  /* final numbers */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.wide { grid-column: 1 / -1; }
  .stat.wide .value { font-size: 13px; font-weight: 400; font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
  .result-title { margin: 0 0 10px; font-size: 15px; }
  .result-title.ok { color: var(--ok); }
  .result-title.failed { color: var(--err); }
</style>
</head>
<body>

<header>
  <h1>Claude Code Web</h1>
  <span class="badge" id="run-status">空闲</span>

  <label class="control hint"><input type="checkbox" id="show-quiet"> 显示系统事件</label>
  <button class="ghost" id="outline-btn">目录</button>
</header>

<div class="layout">
<nav id="outline" aria-label="工具调用目录">
  <h2>outline</h2>
  <div class="lane" id="flow"></div>
  <div class="empty-outline" id="outline-empty">还没有运行</div>
</nav>

<main>

  <!-- The conversation: one <section class="run"> per run -->
  <div id="runs"></div>

  <!-- Where a run is set up and started -->
  <form class="card" id="composer" autocomplete="off">
    <div class="mode-switch" role="radiogroup" aria-label="模式">
      <label><input type="radio" name="mode" value="live" checked> 实时</label>
      <label><input type="radio" name="mode" value="replay"> 回放</label>
    </div>

    <div class="follow-banner">
      <span>↩ 继续会话 <b class="mono" id="resume-id"></b></span>
      <button class="ghost" id="new-session" type="button">开始新会话</button>
    </div>

    <div class="live-only">
      <textarea id="prompt" rows="3" placeholder="要让 Claude Code 做什么？（⌘/Ctrl + Enter 运行）"></textarea>
      <label class="field">工作目录
        <input id="cwd" class="mono" type="text" spellcheck="false"
               placeholder="~/projects/cs2680-sandbox/practice_asign1">
      </label>
    </div>

    <div class="replay-only">
      <label class="field">样例文件 <select id="sample"></select></label>
    </div>

    <div class="composer-actions">
      <span class="form-error" id="form-error"></span>
      <button class="primary" id="run-btn" type="submit">Run</button>
    </div>
  </form>
</main>
</div>

<script>
/* =====================================================================
 * Small helpers
 * ===================================================================== */

const $ = (sel) => document.querySelector(sel);

/** Create an element: el("div", {class: "x"}, "text", childNode, ...) */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.append(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

/** Markdown -> safe HTML. Falls back to plain text if the CDN didn't load. */
function renderMarkdown(text) {
  const box = el("div", { class: "msg" });
  if (window.marked && window.DOMPurify) {
    box.innerHTML = DOMPurify.sanitize(marked.parse(text));
  } else {
    box.style.whiteSpace = "pre-wrap";
    box.textContent = text;
  }
  return box;
}

function formatDuration(ms) {
  if (ms == null) return "—";
  const s = ms / 1000;
  if (s < 60) return `${s.toFixed(1)} 秒`;
  const m = Math.floor(s / 60);
  return `${m} 分 ${Math.round(s - m * 60)} 秒`;
}

function formatCost(usd) {
  return usd == null ? "—" : `$${Number(usd).toFixed(4)}`;
}

/* =====================================================================
 * Tool calls: key input and result text
 * ===================================================================== */

/** The one input field worth showing in the tool card header (SPEC §6.2). */
function keyInput(name, input) {
  input = input || {};
  switch (name) {
    case "Read": case "Edit": case "Write": case "MultiEdit":
      return input.file_path;
    case "NotebookEdit":
      return input.notebook_path;
    case "Bash":
      return input.command;
    case "Grep": case "Glob":
      return input.path ? `${input.pattern}   (in ${input.path})` : input.pattern;
    case "Task": case "Agent":
      return input.description;
    case "WebSearch":
      return input.query;
    case "WebFetch":
      return input.url;
  }
  // Unknown tool: show the first short string field, if any.
  for (const v of Object.values(input)) {
    if (typeof v === "string") return v;
  }
  return "";
}

/** tool_result.content may be a string or a list of blocks (SPEC §5). */
function resultText(content) {
  if (content == null) return "";
  if (typeof content === "string") return content;
  if (Array.isArray(content)) {
    return content.map((b) => {
      if (b.type === "text") return b.text;
      if (b.type === "image") return "[图片]";
      return JSON.stringify(b, null, 2);
    }).join("\n");
  }
  return JSON.stringify(content, null, 2);
}

const PREVIEW_LINES = 12;

/** A <pre> showing the first lines, with a "N more lines" toggle for the rest. */
function foldedPre(text) {
  const wrap = el("div");
  const lines = text.replace(/\n+$/, "").split("\n");
  const pre = el("pre");
  wrap.append(pre);

  if (lines.length <= PREVIEW_LINES) {
    pre.textContent = text || "（无输出）";
    return wrap;
  }
  const hidden = lines.length - PREVIEW_LINES;
  const short = lines.slice(0, PREVIEW_LINES).join("\n");
  let open = false;
  pre.textContent = short;
  const btn = el("button", { class: "fold-btn", text: `▸ 还有 ${hidden} 行` });
  btn.onclick = () => {
    open = !open;
    pre.textContent = open ? lines.join("\n") : short;
    btn.textContent = open ? "▾ 收起" : `▸ 还有 ${hidden} 行`;
  };
  wrap.append(btn);
  return wrap;
}

/* =====================================================================
 * Run state
 * ===================================================================== */

let source = null;          // the EventSource of the current run
/*
 * toolCards: tool_use id -> entry. One entry per tool call:
 *   card, status, result   the card's DOM nodes
 *   subSlot                where this call's subagent section goes (Agent/Task only)
 *   sub                    { details, summary, body, calls } once a subagent event arrives
 *   olItem, lane           its node in the outline flowchart, and the lane it sits in
 *   col                    Agent/Task only: its column in a fork { el, lane, fork, ended }
 *   background             true for a subagent started in the background (ends with task_notification)
 */
let toolCards = new Map();

/*
 * The page shows a conversation: one or more runs, each a <section> of its own.
 * `run` is the newest one, the one events are written into:
 *   section, sessionBox, log, stats   its DOM parts
 *   cwd, resumeId                     how it was started (resumeId = session it continues)
 *   sessionId                         the session id this run reported
 *   gotResult, resultFailed, resultCard, ended
 */
let run = null;
let runCount = 0;

/*
 * `conversation` is the session the next live run continues (SPEC §6.5),
 * or null when the next run starts a new session.
 */
let conversation = null;

/** Run-level status (SPEC §6.4): running / finished / failed. Locks the form while running. */
function setRunStatus(kind, label) {
  const b = $("#run-status");
  b.className = "badge " + kind;
  b.textContent = label;
  const running = kind === "running";
  for (const c of $("#composer").querySelectorAll("button, input, textarea, select")) c.disabled = running;
  $("#run-btn").textContent = running ? "运行中…" : (conversation && currentMode() === "live" ? "继续" : "Run");
}

/** Empty the page: no runs, no outline, no session to continue. */
function clearConversation() {
  toolCards = new Map();
  run = null;
  runCount = 0;
  conversation = null;
  $("#runs").innerHTML = "";
  $("#flow").innerHTML = "";
  $("#flow").openFork = null;
  $("#outline-empty").style.display = "";
  updateComposer();
}

/** Add a new run section at the end of the page and make it the current run. */
function beginRun({ prompt, cwd, resumeId }) {
  runCount++;
  const sessionBox = el("div", { class: "card session-box" });
  const log = el("div", { class: "log" });
  const stats = el("div");
  const head = el("div", { class: "run-head" },
    el("span", { text: `运行 #${runCount}` }),
    resumeId ? el("span", { class: "resume-chip", text: `↩ 续接会话 ${resumeId}` }) : null);
  const section = el("section", { class: "run", id: `run-${runCount}` },
    head,
    prompt ? el("div", { class: "user-prompt" }, el("span", { class: "who", text: `你 · ${cwd}` }), prompt) : null,
    sessionBox, log, stats);
  $("#runs").append(section);

  // In the outline, each run starts with a "You" node (a replay with a "回放" node).
  const headNode = flowNode(prompt ? "You" : "回放", "you",
    prompt ? `运行 #${runCount}${resumeId ? "（续接）" : ""}：${prompt}` : "回放");
  headNode.onclick = () => {
    document.body.classList.remove("outline-open");
    section.scrollIntoView({ behavior: "smooth", block: "start" });
    flash(headNode, section.querySelector(".user-prompt"));
  };
  addFlowItem($("#flow"), headNode);
  $("#outline-empty").style.display = "none";

  run = { section, sessionBox, log, stats, cwd, resumeId, sessionId: null,
          gotResult: false, resultFailed: false, resultCard: null, ended: false };
}

/* ---------- the tree ---------- */

/** The collapsible subagent section inside an Agent/Task card, created on first use. */
function ensureSubagent(entry) {
  if (!entry.sub) {
    const summary = el("summary");
    const body = el("div", { class: "subagent-body" });
    const details = el("details", { class: "subagent", open: "" }, summary, body);
    entry.subSlot.append(details);
    entry.sub = { details, summary, body, calls: 0 };
    updateSubSummary(entry);
    // Folding the subagent in the dialogue folds its column in the outline too.
    details.addEventListener("toggle", () => {
      entry.col?.el.classList.toggle("collapsed", !details.open);
      refreshFoldLabels();
    });
  }
  return entry.sub;
}

function updateSubSummary(entry) {
  const s = entry.sub;
  s.summary.textContent = `子代理：${entry.key || entry.name}（${s.calls} 次工具调用）`;
}

/**
 * Where an event's elements go (SPEC §6.7).
 * Main agent (parent_tool_use_id = null) -> the top-level list.
 * Subagent -> the section inside the tool call that spawned it. This also works
 * for a subagent of a subagent, because that tool call's card is itself nested.
 */
function containerFor(ev) {
  const parent = ev.parent_tool_use_id && toolCards.get(ev.parent_tool_use_id);
  return parent ? ensureSubagent(parent).body : run.log;
}

/** Append a node where it belongs. */
function append(ev, node) {
  containerFor(ev).append(node);
}

/*
 * Follow the bottom of the page while a run streams, like a terminal.
 * `following` only changes when the user scrolls: scroll up to read something
 * and the page stops jumping; scroll back to the bottom and it follows again.
 */
let following = true;
window.addEventListener("scroll", () => {
  following = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 80;
});
function followBottom() {
  if (following) window.scrollTo(0, document.documentElement.scrollHeight);
}

/* ---------- the outline: a flowchart of tool calls ---------- */
/*
 * The flowchart is built from "lanes": a lane is a column of nodes joined by
 * a vertical line. #flow is the main agent's lane. When the main agent starts
 * subagents (Agent/Task calls), they get a "fork": one column per subagent,
 * side by side, and each column holds a lane of its own for that subagent's
 * calls (so a subagent of a subagent forks again inside its column).
 * Below the fork the columns join back into the lane, and the lane's next
 * node hangs under the join.
 */

/** Which colour family a tool belongs to. */
function toolFamily(name) {
  if (["Read", "Glob", "Grep", "LS", "NotebookRead"].includes(name)) return "read";
  if (["Edit", "Write", "MultiEdit", "NotebookEdit"].includes(name)) return "edit";
  if (["Bash", "BashOutput", "KillShell", "KillBash", "Monitor"].includes(name)) return "bash";
  if (isAgentTool(name)) return "agent";
  if (["WebSearch", "WebFetch"].includes(name)) return "web";
  if (["TodoWrite", "TaskCreate", "TaskUpdate", "TaskList"].includes(name)) return "todo";
  return "other";
}

function isAgentTool(name) { return name === "Agent" || name === "Task"; }

function flowNode(label, family, title) {
  return el("button", { class: `fnode f-${family}`, type: "button", title, text: label });
}

/** Add one item (a node or a fork) at the bottom of a lane. Ends any open fork there. */
function addFlowItem(lane, content) {
  lane.openFork = null;
  const item = el("div", { class: "item" }, content);
  lane.append(item);
  return item;
}

/** The lane an event's tool calls go into: the main lane, or its subagent's column. */
function laneFor(ev) {
  const parent = ev.parent_tool_use_id && toolCards.get(ev.parent_tool_use_id);
  if (!parent) return $("#flow");
  return parent.col ? parent.col.lane : parent.lane;
}

/** Keep the outline scrolled to the newest node, unless the user scrolled up in it. */
function withOutlineFollow(fn) {
  const o = $("#outline");
  const atBottom = o.scrollTop + o.clientHeight >= o.scrollHeight - 40;
  fn();
  if (atBottom) o.scrollTop = o.scrollHeight;
}

function addOutlineItem(ev, entry, id) {
  const node = flowNode(entry.name, toolFamily(entry.name), entry.key ? `${entry.name}: ${entry.key}` : entry.name);
  node.classList.add("pending");
  node.onclick = () => jumpTo(id);
  entry.olItem = node;
  const lane = laneFor(ev);
  entry.lane = lane;

  withOutlineFollow(() => {
    if (!isAgentTool(entry.name)) {
      addFlowItem(lane, node);
    } else {
      // Agent/Task calls sent in the same assistant message run in parallel:
      // they share one fork. (stream-json sends each block of a message as its
      // own event, but they all carry the same message.id.)
      const msgId = ev.message?.id;
      let fork = lane.openFork;
      if (!fork || !msgId || fork.msgId !== msgId) {
        const cols = el("div", { class: "cols" });
        const item = addFlowItem(lane, cols);
        item.classList.add("fork");
        fork = { msgId, item, cols, members: [] };
        lane.openFork = fork;
      }
      const colLane = el("div", { class: "lane" });
      const folded = el("button", { class: "folded", type: "button" });
      folded.onclick = () => { if (entry.sub) entry.sub.details.open = true; jumpTo(id); };
      const col = el("div", { class: "col" }, colLane, folded, el("div", { class: "tail" }));
      colLane.append(el("div", { class: "item" }, node));
      fork.cols.append(col);
      fork.members.push(entry);
      entry.col = { el: col, lane: colLane, fork, ended: false };
    }
    refreshFoldLabels();
  });
}

/** A subagent is done: its column's line turns solid; when all are done, so does the join. */
function endColumn(entry) {
  const c = entry.col;
  if (!c || c.ended) return;
  c.ended = true;
  c.el.classList.add("ended");
  if (c.fork.members.every((m) => m.col.ended)) c.fork.item.classList.add("joined");
}

/** Folded columns show "N 个事件已折叠", N = the tool calls hidden in that column. */
function refreshFoldLabels() {
  for (const col of document.querySelectorAll("#flow .col.collapsed")) {
    const n = col.querySelector(":scope > .lane").querySelectorAll(".fnode").length - 1;
    col.querySelector(":scope > .folded").textContent = n > 0 ? `${n} 个事件已折叠` : "已折叠";
  }
}

function setOutlineStatus(entry, kind) {
  if (!entry.olItem) return;
  entry.olItem.classList.remove("pending", "ok", "error");
  entry.olItem.classList.add(kind);
}

/** Briefly highlight an outline node and the dialogue element it points to. */
function flash(node, target) {
  for (const x of [node, target]) {
    if (!x) continue;
    const cls = x === node ? "current" : "flash";
    x.classList.add(cls);
    setTimeout(() => x.classList.remove(cls), 1200);
  }
}

/** Scroll to a tool card, opening any collapsed subagent sections around it first. */
function jumpTo(id) {
  const entry = toolCards.get(id);
  if (!entry) return;
  const { card } = entry;
  for (let d = card.parentElement.closest("details"); d; d = d.parentElement.closest("details")) {
    d.open = true;
  }
  document.body.classList.remove("outline-open"); // close the drawer on narrow windows
  card.scrollIntoView({ behavior: "smooth", block: "start" });
  flash(entry.olItem, card);
}

function quiet(ev, text) {
  append(ev, el("div", { class: "quiet mono", text }));
}

/* =====================================================================
 * Event handlers — one per event type in SPEC §5
 * ===================================================================== */

function handleEvent(ev) {
  switch (ev.type) {
    case "system":     return handleSystem(ev);
    case "assistant":  return handleAssistant(ev);
    case "user":       return handleUser(ev);
    case "result":     return handleResult(ev);
    case "_parse_error":
      return quiet(ev, `无法解析第 ${ev.line} 行：${ev.raw.slice(0, 120)}`);
    default:
      // rate_limit_event and anything unknown: shown quietly, never breaks the page.
      return quiet(ev, `[${ev.type ?? "未知事件"}]`);
  }
}

function handleSystem(ev) {
  if (ev.subtype === "init") {
    if (ev.session_id) run.sessionId = ev.session_id;
    const s = run.sessionBox;
    s.innerHTML = "";
    // A follow-up run says so (SPEC §6.5), and notes it if Claude Code reports a different id.
    let resumed = null;
    if (run.resumeId) {
      resumed = ev.session_id && ev.session_id !== run.resumeId
        ? el("div", { class: "row resumed" }, `↩ 已续接会话 ${run.resumeId}，之前的对话已接上。Claude Code 给这次运行分配了新的会话 ID（见上），下一次追问会用新 ID。`)
        : el("div", { class: "row resumed" }, "↩ 已续接同一会话，Claude 记得之前的对话");
    }
    s.append(
      el("div", { class: "row" }, "会话 ", el("b", { class: "mono", text: ev.session_id || "—" })),
      el("div", { class: "row" }, "模型 ", el("b", { text: ev.model || "—" }), "　目录 ", el("b", { class: "mono", text: ev.cwd || "—" })),
    );
    if (resumed) s.append(resumed);  // DOM append(null) would print "null"
    s.style.display = "block";
    return;
  }
  if (ev.subtype === "thinking_tokens") return; // pure noise
  // Background subagents: the Agent call returns at once ("Async agent launched"),
  // and the subagent's real end comes later as a task_notification.
  const task = ev.tool_use_id && toolCards.get(ev.tool_use_id);
  if (task && ev.subtype === "task_started" && ev.is_backgrounded) task.background = true;
  if (task && ev.subtype === "task_notification") finishBackground(task, ev.status);
  const extra = ev.description || ev.status || "";
  quiet(ev, `[system · ${ev.subtype}] ${extra}`);
}

function handleAssistant(ev) {
  for (const block of ev.message?.content ?? []) {
    if (block.type === "text" && block.text) {
      append(ev, renderMarkdown(block.text));
    } else if (block.type === "tool_use") {
      append(ev, makeToolCard(ev, block));
    } else if (block.type === "thinking") {
      if (block.thinking) {
        append(ev, el("details", { class: "quiet-block" },
          el("summary", { text: "思考过程" }), el("pre", { text: block.thinking })));
      }
    } else {
      quiet(ev, `[assistant 内容块 · ${block.type}]`);
    }
  }
}

function handleUser(ev) {
  const content = ev.message?.content;
  if (typeof content === "string") {
    append(ev, el("details", { class: "quiet-block" }, el("summary", { text: "用户消息" }), el("pre", { text: content })));
    return;
  }
  for (const block of content ?? []) {
    if (block.type === "tool_result") {
      attachResult(ev, block);
    } else if (block.type === "text") {
      // In the samples this is the task prompt handed to a subagent.
      const title = ev.parent_tool_use_id ? "子代理收到的任务" : "用户消息";
      append(ev, el("details", { class: "quiet-block" }, el("summary", { text: title }), el("pre", { text: block.text })));
    }
  }
}

function makeToolCard(ev, block) {
  const key = keyInput(block.name, block.input) || "";
  const status = el("span", { class: "tool-status", text: "运行中…" });
  const subSlot = el("div");
  const result = el("div", { class: "tool-result" });
  const card = el("div", { class: "tool pending", id: `tool-${block.id}` },
    el("div", { class: "tool-head" },
      el("span", { class: "tool-name", text: block.name }),
      el("code", { class: "tool-key", text: key, title: key }),
      status,
    ),
    el("details", {},
      el("summary", { text: "完整输入" }),
      el("pre", { text: JSON.stringify(block.input, null, 2) }),
    ),
    subSlot,   // subagent section goes here, between the input and the final result
    result,
  );
  const entry = { card, status, subSlot, result, name: block.name, key };
  toolCards.set(block.id, entry);
  addOutlineItem(ev, entry, block.id);

  const parent = ev.parent_tool_use_id && toolCards.get(ev.parent_tool_use_id);
  if (parent) {
    ensureSubagent(parent).calls++;
    updateSubSummary(parent);
  }
  return card;
}

function attachResult(ev, block) {
  const entry = toolCards.get(block.tool_use_id);
  const text = resultText(block.content);
  const isError = block.is_error === true;

  if (!entry) {
    // A result whose tool call we never saw. Show it anyway.
    append(ev, el("details", { class: "quiet-block" },
      el("summary", { text: `工具结果（未找到对应调用 ${block.tool_use_id}）` }), el("pre", { text })));
    return;
  }
  entry.result.innerHTML = "";
  entry.result.append(foldedPre(text));

  if (entry.col && !isError && (entry.background || text.startsWith("Async agent launched"))) {
    // Only the launch receipt of a background subagent: it is still running.
    entry.background = true;
    entry.status.textContent = "后台运行中…";
    return;
  }
  setToolStatus(entry, isError ? "error" : "ok", isError ? "错误" : "成功");
  endColumn(entry);
}

/** A background subagent reported its end (task_notification). */
function finishBackground(entry, status) {
  const ok = status === "completed";
  setToolStatus(entry, ok ? "ok" : "error", ok ? "成功" : `失败（${status}）`);
  endColumn(entry);
}

function setToolStatus(entry, kind, label) {
  entry.card.classList.remove("pending", "ok", "error");
  entry.card.classList.add(kind);
  entry.status.textContent = label;
  setOutlineStatus(entry, kind);
}

function handleResult(ev) {
  run.gotResult = true;
  if (ev.session_id) run.sessionId = ev.session_id;
  // SPEC §5: a run failed if is_error is true or subtype is anything but "success".
  const failed = ev.is_error === true || ev.subtype !== "success";
  run.resultFailed = failed;

  const stat = (label, value, wide = false) =>
    el("div", { class: "stat" + (wide ? " wide" : "") },
      el("div", { class: "label", text: label }), el("div", { class: "value", text: value }));

  const card = el("div", { class: "card" + (failed ? " error-box" : "") },
    el("h3", { class: "result-title " + (failed ? "failed" : "ok"),
               text: failed ? `运行失败（${ev.subtype}）` : "运行完成" }),
    // On failure, `result` usually holds the error message.
    failed && ev.result ? el("p", { text: String(ev.result) }) : null,
    el("div", { class: "stats" },
      stat("费用", formatCost(ev.total_cost_usd)),
      stat("耗时", formatDuration(ev.duration_ms)),
      stat("轮数", String(ev.num_turns ?? "—")),
      stat("会话 ID", ev.session_id || "—", true),
    ),
  );
  run.stats.append(card);
  run.resultCard = card;
}

/** A red box explaining why the run failed, with stderr if there is any. */
function errorCard(title, message, stderr) {
  return el("div", { class: "card error-box" },
    el("h3", { text: title }),
    message ? el("p", { text: message }) : null,
    stderr ? el("details", { open: "" }, el("summary", { text: "stderr" }), el("pre", { text: stderr })) : null,
  );
}

/**
 * The stream is over, one way or another. Decide the run's final status (SPEC §5):
 *   - the run could not start (run_error)                  -> failed
 *   - no `result` event (crash, non-zero exit, lost link)  -> failed
 *   - `result` with is_error or subtype != success         -> failed
 *   - otherwise                                            -> finished
 * Every path ends here, so the page never keeps spinning.
 *
 * info: { runError?: string, exitCode?: number|null, stderr?: string, lostConnection?: bool }
 */
function finishRun(info = {}) {
  if (source) { source.close(); source = null; }
  if (run.ended) return;  // e.g. `end` already handled, then the socket closed
  run.ended = true;
  stopTimer();
  const { gotResult, resultFailed, resultCard } = run;

  for (const entry of toolCards.values()) {
    if (entry.card.classList.contains("pending")) setToolStatus(entry, "error", "无结果");
    endColumn(entry);  // the run is over, so every subagent is too
  }

  const stderr = (info.stderr || "").trim();
  const exit = info.exitCode;
  const slot = run.stats;
  let failed = true;

  if (info.runError) {
    slot.append(errorCard("运行没有启动", info.runError));
  } else if (info.lostConnection && !gotResult) {
    slot.append(errorCard("运行中断", "与服务器的连接断开了。请确认服务器仍在运行，然后再试一次。"));
  } else if (!gotResult) {
    const why = exit != null && exit !== 0
      ? `claude 进程以退出码 ${exit} 结束，没有返回 result 事件。`
      : "事件流已结束，但没有收到 result 事件。";
    slot.append(errorCard("运行失败", why, stderr));
  } else if (resultFailed) {
    if (stderr && resultCard) {
      resultCard.append(el("details", { open: "" }, el("summary", { text: "stderr" }), el("pre", { text: stderr })));
    }
  } else {
    failed = false;
  }

  // A live run that reported a session id can be continued, even if it failed
  // (e.g. is_error). A run that never started keeps the previous session, if any.
  if (run.cwd && run.sessionId) conversation = { sessionId: run.sessionId, cwd: run.cwd };
  updateComposer();

  setRunStatus(failed ? "failed" : "finished", failed ? "失败" : "完成");
  followBottom();  // bring the final numbers or the error into view
  if (conversation) $("#prompt").focus();
}

/* ---------- elapsed-time display on the status badge ---------- */

let timer = null;
function startTimer() {
  const t0 = Date.now();
  const tick = () => setRunStatus("running", `进行中 · ${Math.floor((Date.now() - t0) / 1000)} 秒`);
  tick();
  timer = setInterval(tick, 1000);
}
function stopTimer() { clearInterval(timer); timer = null; }

/* =====================================================================
 * Starting a run
 * ===================================================================== */

function currentMode() {
  return document.querySelector("input[name=mode]:checked").value;
}

function showMode() {
  const mode = currentMode();
  $("#form-error").textContent = "";
  store("mode", mode);
  updateComposer();
}

/**
 * Show whether the next live run is a new session or a follow-up.
 * In a follow-up the directory is locked: Claude Code keeps sessions per
 * directory, so --resume only finds the session from the same cwd.
 */
function updateComposer() {
  const live = currentMode() === "live";
  const follow = live && conversation != null;
  $("#composer").className = `card mode-${currentMode()}` + (follow ? " follow-up" : "");
  $("#resume-id").textContent = conversation ? conversation.sessionId : "";
  const cwd = $("#cwd");
  cwd.readOnly = follow;
  if (follow) cwd.value = conversation.cwd;
  $("#prompt").placeholder = follow
    ? "继续追问，Claude 会记得上面的对话（⌘/Ctrl + Enter 运行）"
    : "要让 Claude Code 做什么？（⌘/Ctrl + Enter 运行）";
  $("#run-btn").textContent = follow ? "继续" : "Run";
}

/** Open the SSE stream for the current run and route its events. Used by both modes. */
function startStream(url) {
  if (source) source.close();
  startTimer();
  following = true;

  // EventSource = the browser's built-in SSE client.
  source = new EventSource(url);

  source.onmessage = (msg) => {
    let ev;
    try { ev = JSON.parse(msg.data); } catch { return; }
    try { handleEvent(ev); }
    catch (err) { console.error("render error", err, ev); quiet(ev, `渲染出错：${err.message}`); }
    followBottom();
  };
  source.addEventListener("run_error", (msg) => {
    finishRun({ runError: JSON.parse(msg.data).message });
  });
  source.addEventListener("end", (msg) => {
    const d = JSON.parse(msg.data);
    finishRun({ exitCode: d.exit_code, stderr: d.stderr });
  });
  // Fires if the server can't be reached, answers with an error, or the stream drops.
  // finishRun closes the EventSource, which also stops the browser from reconnecting
  // (a reconnect would start a second claude process).
  source.onerror = () => finishRun({ lostConnection: true });
}

function startRun(e) {
  e.preventDefault();
  if (source) return;  // a run is already going
  const err = $("#form-error");
  err.textContent = "";

  if (currentMode() === "replay") {
    const file = $("#sample").value;
    if (!file) { err.textContent = "请选择一个样例文件。"; return; }
    clearConversation();  // a replay always stands alone
    beginRun({});
    startStream(`/api/replay?file=${encodeURIComponent(file)}`);
    return;
  }

  const prompt = $("#prompt").value.trim();
  const cwd = $("#cwd").value.trim();
  if (!prompt) { err.textContent = "请输入提示词。"; $("#prompt").focus(); return; }
  if (!cwd) { err.textContent = "请填写工作目录。"; $("#cwd").focus(); return; }

  const params = new URLSearchParams({ prompt, cwd });
  let resumeId = null;
  if (conversation) {
    // Follow-up: continue the same session, added below the earlier runs.
    resumeId = conversation.sessionId;
    params.set("resume", resumeId);
  } else {
    // New session: start from an empty page.
    clearConversation();
    store("cwd", cwd);
  }
  beginRun({ prompt, cwd, resumeId });
  $("#prompt").value = "";
  startStream(`/api/run?${params}`);
}

/* localStorage only remembers conveniences (last mode and directory); it may be unavailable. */
function store(key, value) { try { localStorage.setItem("ccweb." + key, value); } catch {} }
function recall(key) { try { return localStorage.getItem("ccweb." + key); } catch { return null; } }

async function loadSamples() {
  const select = $("#sample");
  try {
    const res = await fetch("/api/samples");
    const names = await res.json();
    select.innerHTML = "";
    for (const n of names) select.append(el("option", { value: n, text: n }));
  } catch {
    select.append(el("option", { value: "", text: "（无法读取样例列表）" }));
  }
}

$("#composer").addEventListener("submit", startRun);
$("#prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#composer").requestSubmit();
});
for (const r of document.querySelectorAll("input[name=mode]")) r.onchange = showMode;
if (recall("mode") === "replay") document.querySelector("input[name=mode][value=replay]").checked = true;
$("#cwd").value = recall("cwd") || "";
$("#new-session").onclick = () => { if (!source) { clearConversation(); $("#prompt").focus(); } };
showMode();
$("#show-quiet").onchange = (e) => document.body.classList.toggle("show-quiet", e.target.checked);
$("#outline-btn").onclick = () => document.body.classList.toggle("outline-open");

// The header can wrap to two lines; keep the sticky outline and scroll targets just below it.
function syncHeaderHeight() {
  document.documentElement.style.setProperty("--header-h", $("header").offsetHeight + "px");
}
window.addEventListener("resize", syncHeaderHeight);
syncHeaderHeight();
loadSamples();
</script>
</body>
